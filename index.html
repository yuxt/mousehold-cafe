<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mousehold Cat Café — coming soon</title>
<meta name="description" content="Mousehold Cat Café — a cozy sanctuary for cats and the people who love them. Something small is being built here.">
<meta name="color-scheme" content="light dark">

<meta property="og:title" content="Mousehold Cat Café">
<meta property="og:description" content="A cozy sanctuary for cats and the people who love them. Something small is being built here.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mousehold.cafe/">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐾</text></svg>">

<style>
  :root {
    --bg:      #faf6f0;
    --surface: #fffdfa;
    --ink:     #2e2a26;
    --muted:   #7a7068;
    --accent:  #b2684a;
    --line:    #e6ddd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1b1917;
      --surface: #23201d;
      --ink:     #f0e9e0;
      --muted:   #a89d92;
      --accent:  #e09472;
      --line:    #342f2a;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 34rem;
    text-align: center;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    padding: clamp(2rem, 6vw, 3.25rem) clamp(1.25rem, 5vw, 2.5rem);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 12px 32px -12px rgb(0 0 0 / 0.12);
  }

  .cat { display: block; width: 84px; height: 84px; margin: 0 auto 1.5rem; color: var(--accent); }

  .eyebrow {
    margin: 0 0 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0 0 0.75rem;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: clamp(2rem, 8vw, 2.75rem);
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.15;
  }

  .tagline { margin: 0 0 1.75rem; font-size: 1.0625rem; color: var(--muted); }

  hr { border: 0; border-top: 1px solid var(--line); margin: 0 0 1.75rem; }

  .note { margin: 0; font-size: 0.9375rem; color: var(--muted); }
  .note strong { color: var(--ink); font-weight: 600; }

  footer { margin-top: 1.75rem; font-size: 0.8125rem; color: var(--muted); }
  footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  footer a:hover, footer a:focus-visible { color: var(--accent); }
</style>
</head>
<body>
<main class="card" role="main">

  <svg class="cat" viewBox="0 0 64 64" fill="none" stroke="currentColor"
       stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 26 13 11l12 8.5"/>
    <path d="M50 26l1-15-12 8.5"/>
    <path d="M32 17c10.5 0 18 8 18 18.5S42.5 54 32 54s-18-7-18-18.5S21.5 17 32 17Z"/>
    <circle cx="24.5" cy="34" r="1.6" fill="currentColor" stroke="none"/>
    <circle cx="39.5" cy="34" r="1.6" fill="currentColor" stroke="none"/>
    <path d="M32 39v2.5"/>
    <path d="M32 41.5c-1.4 1.8-4.4 1.6-5.2-.4"/>
    <path d="M32 41.5c1.4 1.8 4.4 1.6 5.2-.4"/>
    <path d="M18 36.5 7 34.5M18 40l-10 3"/>
    <path d="M46 36.5 57 34.5M46 40l10 3"/>
  </svg>

  <p class="eyebrow">Mousehold</p>
  <h1>Mousehold Cat&nbsp;Café</h1>
  <p class="tagline">A cozy sanctuary for cats and&nbsp;the people who love&nbsp;them.</p>

  <hr>

  <p class="note">
    Something small is being built here — starting with <strong>the cats themselves</strong>:
    their profiles, their personalities, and their favorite&nbsp;things.
  </p>

  <footer>
    <a href="https://github.com/yuxt/mousehold-cafe">Follow along on GitHub</a>
  </footer>

</main>
</body>
</html>
