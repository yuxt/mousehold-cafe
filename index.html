<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mousehold Cat Café — coming soon</title>
<meta name="description" content="Mousehold Cat Café — a cozy sanctuary for cats and the people who love them. Something small is being built here.">
<meta name="color-scheme" content="light dark">

<meta property="og:title" content="Mousehold Cat Café">
<meta property="og:description" content="A cozy sanctuary for cats and the people who love them. Something small is being built here.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mousehold.cafe/">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐾</text></svg>">

<style>
  :root {
    --bg:      #faf6f0;
    --surface: #fffdfa;
    --ink:     #2e2a26;
    --muted:   #7a7068;
    --accent:  #b2684a;
    --line:    #e6ddd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1b1917;
      --surface: #23201d;
      --ink:     #f0e9e0;
      --muted:   #a89d92;
      --accent:  #e09472;
      --line:    #342f2a;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main {
    --peek-w: min(220px, 52vw);
    position: relative;
    width: 100%;
    max-width: 34rem;
    /* room for the kitten above the card, so the pair stays centred and is never clipped */
    margin-top: calc(var(--peek-w) * 0.65);
    text-align: center;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    padding: clamp(2rem, 6vw, 3.25rem) clamp(1.25rem, 5vw, 2.5rem);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 12px 32px -12px rgb(0 0 0 / 0.12);
  }

  /* sleeping kitten resting on the top edge of the card: chin on the border, paws over it */
  .peek {
    position: absolute;
    left: 50%;
    bottom: 100%;
    width: var(--peek-w);
    height: auto;
    transform: translate(-50%, 5.2%);
    pointer-events: none;
    user-select: none;
  }

  .eyebrow {
    margin: 0 0 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0 0 0.75rem;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: clamp(2rem, 8vw, 2.75rem);
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.15;
  }

  .tagline { margin: 0 0 1.75rem; font-size: 1.0625rem; color: var(--muted); }

  hr { border: 0; border-top: 1px solid var(--line); margin: 0 0 1.75rem; }

  .note { margin: 0; font-size: 0.9375rem; color: var(--muted); }
  .note strong { color: var(--ink); font-weight: 600; }

  .byline { margin: 1.25rem 0 0; font-size: 0.9375rem; color: var(--muted); }
  .byline strong { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main class="card" role="main">

  <img class="peek" src="assets/sleeping-kitten.webp" width="548" height="375"
       alt="A fluffy black kitten asleep, resting its chin and paws on top of the card">

  <p class="eyebrow">Mousehold</p>
  <h1>Mousehold Cat&nbsp;Café</h1>
  <p class="tagline">A cozy sanctuary for cats and&nbsp;the people who love&nbsp;them.</p>

  <hr>

  <p class="note">
    Something small is being built here — starting with <strong>the cats themselves</strong>:
    their profiles, their personalities, and their favorite&nbsp;things.
  </p>

  <p class="byline">A project of <strong>Vera</strong>. Meow.</p>

</main>
</body>
</html>
