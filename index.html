<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mousehold Cat Café — coming soon</title>
<meta name="description" content="Mousehold Cat Café — a cozy sanctuary for cats and the people who love them. Something small is being built here.">
<meta name="color-scheme" content="light dark">

<meta property="og:title" content="Mousehold Cat Café">
<meta property="og:description" content="A cozy sanctuary for cats and the people who love them. Something small is being built here.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mousehold.cafe/">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐾</text></svg>">

<style>
  :root {
    --bg:      #faf6f0;
    --surface: #fffdfa;
    --ink:     #2e2a26;
    --muted:   #7a7068;
    --accent:  #b2684a;
    --line:    #e6ddd1;
    --mouse:   #9b8f86;
    --mouse-2: #857a72;
    --pink:    #e0a596;
    --hole:    #2e2a26;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1b1917;
      --surface: #23201d;
      --ink:     #f0e9e0;
      --muted:   #a89d92;
      --accent:  #e09472;
      --line:    #342f2a;
      --mouse:   #b5aaa0;
      --mouse-2: #9a8f86;
      --pink:    #e3a596;
      --hole:    #000;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem 4.5rem;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main {
    --peek-w: min(220px, 52vw);
    position: relative;
    width: 100%;
    max-width: 34rem;
    /* room for the kitten above the card, so the pair stays centred and is never clipped */
    margin-top: calc(var(--peek-w) * 0.65);
    text-align: center;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    padding: clamp(2rem, 6vw, 3.25rem) clamp(1.25rem, 5vw, 2.5rem);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 12px 32px -12px rgb(0 0 0 / 0.12);
  }

  /* sleeping kitten resting on the top edge of the card: chin on the border, paws over it */
  .peek {
    position: absolute;
    left: 50%;
    bottom: 100%;
    width: var(--peek-w);
    transform: translate(-50%, 5.2%);
    pointer-events: none;
    user-select: none;
  }
  .peek img { display: block; width: 100%; height: auto; }

  /* open eyes, drawn over the sleeping face: he is mostly awake, blinks now and then, and takes a short doze */
  .peek .eyes {
    position: absolute;
    inset: 0;
    opacity: 1;
    animation: peek-awake 12s linear -9s infinite;
  }
  @keyframes peek-awake {
    0%, 15%     { opacity: 0; }   /* short doze */
    17%         { opacity: 1; }   /* wakes */
    44%         { opacity: 1; }
    45%, 45.8%  { opacity: 0; }   /* blink */
    46.8%       { opacity: 1; }
    70%         { opacity: 1; }
    71%, 71.8%  { opacity: 0; }   /* blink */
    72.8%       { opacity: 1; }
    93%         { opacity: 1; }
    96%, 100%   { opacity: 0; }   /* drifts off */
  }
  /* a mouse scurries along the bottom edge of the screen, left to right, into its hole.
     Same 12s loop as the kitten: the run happens while he dozes. */
  .floor {
    --hole-w: 46px;
    --hole-r: max(20px, 7vw);            /* gap between the hole and the right edge */
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 52px;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }
  .hole {
    position: absolute;
    right: var(--hole-r);
    bottom: 0;
    width: var(--hole-w);
    height: 36px;
    display: block;
  }
  .hole path { fill: var(--hole); stroke: var(--line); stroke-width: 1.5; }
  /* the track runs from the left edge of the screen to the middle of the hole */
  .track {
    position: absolute;
    left: 0;
    right: calc(var(--hole-r) + var(--hole-w) / 2 - 8px);
    bottom: 0;
    height: 100%;
  }
  .run {
    position: absolute;
    inset: 0;
    transform: translateX(calc(-100% - 12px));
    animation: mouse-run 12s linear 2.6s infinite backwards;
  }
  .mouse {
    position: absolute;
    right: 0;
    bottom: 1px;
    width: 58px;
    height: auto;
    display: block;
    overflow: visible;
    transform-origin: 80% 100%;
    animation: mouse-into-hole 12s linear 2.6s infinite backwards;
  }
  .mouse .body { fill: var(--mouse); }
  .mouse .ear-back { fill: var(--mouse-2); }
  .mouse .ear-in, .mouse .nose { fill: var(--pink); }
  .mouse .eye { fill: var(--hole); }
  .mouse .tail { fill: none; stroke: var(--pink); stroke-width: 2.2; stroke-linecap: round; }
  .mouse .leg { stroke: var(--mouse-2); stroke-width: 3; stroke-linecap: round; transform-box: fill-box; transform-origin: 50% 0; }
  .mouse .bob { animation: mouse-bob 0.2s ease-in-out infinite alternate; }
  .mouse .leg.a { animation: mouse-leg 0.2s ease-in-out infinite alternate; }
  .mouse .leg.b { animation: mouse-leg 0.2s ease-in-out infinite alternate-reverse; }
  .mouse .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: mouse-tail 0.4s ease-in-out infinite alternate; }

  @keyframes mouse-run {
    0%          { transform: translateX(calc(-100% - 12px)); }   /* just off the left edge */
    15.5%, 100% { transform: translateX(0); }                    /* nose in the hole */
  }
  @keyframes mouse-into-hole {
    0%, 15.5%   { opacity: 1; transform: translateX(0) scale(1); }
    17.5%, 100% { opacity: 0; transform: translateX(14px) scale(0.3); }   /* slips into the dark */
  }
  @keyframes mouse-bob  { from { transform: translateY(0); }     to { transform: translateY(-1.5px); } }
  @keyframes mouse-leg  { from { transform: rotate(-32deg); }    to { transform: rotate(32deg); } }
  @keyframes mouse-tail { from { transform: rotate(-7deg); }     to { transform: rotate(9deg); } }

  @media (prefers-reduced-motion: reduce) {
    .peek .eyes { animation: none; }
    .run { display: none; }              /* the hole stays; nobody runs */
  }

  .eyebrow {
    margin: 0 0 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0 0 0.75rem;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: clamp(2rem, 8vw, 2.75rem);
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.15;
  }

  .tagline { margin: 0 0 1.75rem; font-size: 1.0625rem; color: var(--muted); }

  hr { border: 0; border-top: 1px solid var(--line); margin: 0 0 1.75rem; }

  .note { margin: 0; font-size: 0.9375rem; color: var(--muted); }
  .note strong { color: var(--ink); font-weight: 600; }

  .byline { margin: 1.25rem 0 0; font-size: 0.9375rem; color: var(--muted); }
  .byline strong { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main class="card" role="main">

  <div class="peek">
    <img src="assets/sleeping-kitten.webp" width="548" height="375"
         alt="A fluffy black kitten peeking over the top of the card, chin and paws resting on its edge">
    <img class="eyes" src="assets/kitten-eyes-open.webp" width="548" height="375" alt="" aria-hidden="true">
  </div>

  <p class="eyebrow">Mousehold</p>
  <h1>Mousehold Cat&nbsp;Café</h1>
  <p class="tagline">A cozy sanctuary for cats and&nbsp;the people who love&nbsp;them.</p>

  <hr>

  <p class="note">
    Something small is being built here — starting with <strong>the cats themselves</strong>:
    their profiles, their personalities, and their favorite&nbsp;things.
  </p>

  <p class="byline">A project of <strong>Vera</strong>. Meow.</p>

</main>

<div class="floor" aria-hidden="true">
  <svg class="hole" viewBox="0 0 46 36"><path d="M1 37V22C1 10.4 10.8 1 23 1s22 9.4 22 21v15Z"/></svg>
  <div class="track"><div class="run">
    <svg class="mouse" viewBox="0 0 64 36">
      <path class="tail" d="M15 25C7 26 1 20 4 12"/>
      <line class="leg a" x1="22" y1="28" x2="22" y2="34"/>
      <line class="leg b" x1="27" y1="28" x2="27" y2="34"/>
      <line class="leg b" x1="43" y1="28" x2="43" y2="34"/>
      <line class="leg a" x1="48" y1="28" x2="48" y2="34"/>
      <g class="bob">
        <circle class="ear-back" cx="38" cy="11" r="5.5"/>
        <path class="body" d="M13 23C13 14 25 9.500 38 11.500C48 13 57 18 61.500 23C57 28 46 31 34 31C22 31 13 29.500 13 23Z"/>
        <circle class="body" cx="44" cy="11.500" r="6.500"/>
        <circle class="ear-in" cx="44" cy="11.500" r="3.800"/>
        <circle class="eye" cx="52" cy="19" r="1.600"/>
        <circle class="nose" cx="61.500" cy="23" r="1.800"/>
      </g>
    </svg>
  </div></div>
</div>
</body>
</html>
