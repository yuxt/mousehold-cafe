<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mousehold Cat Café — coming soon</title>
<meta name="description" content="Mousehold Cat Café — a cozy sanctuary for cats and the people who love them. Something small is being built here.">
<meta name="color-scheme" content="light dark">

<meta property="og:title" content="Mousehold Cat Café">
<meta property="og:description" content="A cozy sanctuary for cats and the people who love them. Something small is being built here.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mousehold.cafe/">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐾</text></svg>">

<style>
  :root {
    --bg:      #faf6f0;
    --surface: #fffdfa;
    --ink:     #2e2a26;
    --muted:   #7a7068;
    --accent:  #b2684a;
    --line:    #e6ddd1;
    --hole:    #2e2a26;
    --tile:    url("assets/cat-pattern.webp");
    --tile-opacity: 0.5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1b1917;
      --surface: #23201d;
      --ink:     #f0e9e0;
      --muted:   #a89d92;
      --accent:  #e09472;
      --line:    #342f2a;
      --hole:    #000;
      --tile:    url("assets/cat-pattern-dark.webp");
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem 4.5rem;
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* wallpaper of little cat outlines, tiled across the whole page.
     --tile-opacity sets how strong it is: 1 is the image as drawn, lower is fainter. */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background: var(--tile) center top / 627px auto repeat;
    opacity: var(--tile-opacity);
    pointer-events: none;
  }

  main {
    --peek-w: min(220px, 52vw);
    --logo-w: 75vw;                      /* the logo spans three quarters of the page */
    --pad-x: clamp(1.25rem, 5vw, 2.5rem);
    position: relative;
    /* wide enough to hold the logo; on small screens it just fills the page */
    width: min(100%, max(34rem, calc(var(--logo-w) + 2 * var(--pad-x) + 2px)));
    /* room for the kitten above the card, so the pair stays centred and is never clipped */
    margin-top: calc(var(--peek-w) * 0.65);
    /* and room below it for his tail */
    margin-bottom: calc(var(--peek-w) * 0.58);
    text-align: center;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    padding: clamp(2rem, 6vw, 3.25rem) var(--pad-x);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 12px 32px -12px rgb(0 0 0 / 0.12);
  }

  /* sleeping kitten resting on the top edge of the card: chin on the border, paws over it */
  .peek {
    position: absolute;
    left: 50%;
    bottom: 100%;
    width: var(--peek-w);
    transform: translate(-50%, 5.2%);
    pointer-events: none;
    user-select: none;
  }
  .peek img { display: block; width: 100%; height: auto; }

  /* Sprite sheets: a grid of animation frames shown one at a time. The image steps
     sideways through a row while its wrapper steps down through the rows. */
  .sprite { overflow: hidden; pointer-events: none; user-select: none; }
  .sprite img { display: block; height: auto; max-width: none; }
  @keyframes sprite-x { to { transform: translateX(-100%); } }
  @keyframes sprite-y { to { transform: translateY(-100%); } }

  /* his tail hangs out from behind the bottom edge of the card and sways */
  .tail {
    position: absolute;
    top: calc(100% - 10px);              /* the cut end tucks behind the card */
    left: calc(50% - var(--peek-w) * 0.16);   /* centred under the card */
    width: calc(var(--peek-w) * 0.32);
    aspect-ratio: 140 / 276;
    z-index: -1;
  }
  .tail .rows { animation: sprite-y 4s steps(8) infinite; }
  .tail img   { width: 1000%; animation: sprite-x 0.5s steps(10) infinite; }   /* 10 x 8 frames */

  /* open eyes, drawn over the sleeping face: he is mostly awake, blinks now and then, and takes a short doze */
  .peek .eyes {
    position: absolute;
    inset: 0;
    opacity: 1;
    animation: peek-awake 12s linear -9s infinite;
  }
  @keyframes peek-awake {
    0%, 15%     { opacity: 0; }   /* short doze */
    17%         { opacity: 1; }   /* wakes */
    44%         { opacity: 1; }
    45%, 45.8%  { opacity: 0; }   /* blink */
    46.8%       { opacity: 1; }
    70%         { opacity: 1; }
    71%, 71.8%  { opacity: 0; }   /* blink */
    72.8%       { opacity: 1; }
    93%         { opacity: 1; }
    96%, 100%   { opacity: 0; }   /* drifts off */
  }
  /* a mouse scurries along the bottom edge of the screen, left to right, into its hole.
     Same 12s loop as the kitten: the run happens while he dozes. */
  .floor {
    --hole-w: 58px;
    --hole-r: max(20px, 7vw);            /* gap between the hole and the right edge */
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 76px;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }
  .hole {
    position: absolute;
    right: var(--hole-r);
    bottom: 0;
    width: var(--hole-w);
    height: 50px;
    display: block;
  }
  .hole path { fill: var(--hole); stroke: var(--line); stroke-width: 1.5; }
  /* the track runs from the left edge of the screen to the middle of the hole */
  .track {
    position: absolute;
    left: 0;
    right: calc(var(--hole-r) + var(--hole-w) / 2 - 8px);
    bottom: 0;
    height: 100%;
  }
  .run {
    position: absolute;
    inset: 0;
    transform: translateX(calc(-100% - 12px));
    animation: mouse-run 12s linear 2.6s infinite backwards;
  }
  .mouse {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 104px;
    aspect-ratio: 208 / 112;
    transform-origin: 85% 100%;
    animation: mouse-into-hole 12s linear 2.6s infinite backwards;
  }
  .mouse .rows { animation: sprite-y 1.2s steps(4) infinite; }
  .mouse img   { width: 600%; animation: sprite-x 0.3s steps(6) infinite; }    /* 6 x 4 frames */

  @keyframes mouse-run {
    0%          { transform: translateX(calc(-100% - 12px)); }   /* just off the left edge */
    15.5%, 100% { transform: translateX(0); }                    /* nose in the hole */
  }
  @keyframes mouse-into-hole {
    0%, 15.5%   { opacity: 1; transform: translateX(0) scale(1); }
    17.5%, 100% { opacity: 0; transform: translateX(14px) scale(0.3); }   /* slips into the dark */
  }

  @media (prefers-reduced-motion: reduce) {
    .peek .eyes { animation: none; }
    .tail .rows, .tail img { animation: none; }   /* the tail hangs still */
    .run { display: none; }                       /* the hole stays; nobody runs */
  }

  /* the Mousehold logo is the page title */
  .logo { margin: 0 0 1.25rem; line-height: 0; }
  .logo img { display: block; width: var(--logo-w); max-width: 100%; height: auto; margin: 0 auto; }

  /* the text below keeps a comfortable reading width however wide the card gets */
  .tagline, hr, .note, .byline { max-width: 32rem; margin-left: auto; margin-right: auto; }

  .tagline { margin-top: 0; margin-bottom: 1.75rem; font-size: 1.0625rem; color: var(--muted); }

  hr { border: 0; border-top: 1px solid var(--line); margin-top: 0; margin-bottom: 1.75rem; }

  .note { margin-top: 0; margin-bottom: 0; font-size: 0.9375rem; color: var(--muted); }
  .note strong { color: var(--ink); font-weight: 600; }

  .byline { margin-top: 1.25rem; margin-bottom: 0; font-size: 0.9375rem; color: var(--muted); }
  .byline strong { color: var(--ink); font-weight: 600; }

  @media (max-width: 600px) {
    body { min-height: 100svh; place-items: start center; padding: 1.25rem 1.25rem 3rem; }
    body::before { display: none; }
    main {
      --peek-w: min(170px, 44vw);
      margin-top: calc(var(--peek-w) * 0.72);
      margin-bottom: calc(var(--peek-w) * 0.3);
    }
    .card { padding-block: 1.125rem; }
    .tagline { margin-bottom: 0.75rem; }
    .byline { margin-top: 0.875rem; }
    hr { display: none; }
  }
</style>
</head>
<body>
<main class="card" role="main">

  <div class="peek">
    <img src="assets/sleeping-kitten.webp" width="548" height="375"
         alt="A fluffy black kitten peeking over the top of the card, chin and paws resting on its edge">
    <img class="eyes" src="assets/kitten-eyes-open.webp" width="548" height="375" alt="" aria-hidden="true">
  </div>
  <div class="tail sprite" aria-hidden="true"><div class="rows">
    <img src="assets/kitten-tail.webp" width="1400" height="2208" alt="">
  </div></div>

  <h1 class="logo">
    <picture>
      <source srcset="assets/mousehold-logo-light.svg" media="(prefers-color-scheme: dark)">
      <img src="assets/mousehold-logo.svg" width="1727" height="435" alt="Mousehold Cat Café">
    </picture>
  </h1>
  <p class="tagline">A cozy sanctuary for cats and&nbsp;the people who love&nbsp;them.</p>

  <hr>

  <p class="note">
    Something small is being built here — starting with <strong>the cats themselves</strong>:
    their profiles, their personalities, and their favorite&nbsp;things.
  </p>

  <p class="byline">A project of <strong>Vera</strong>. Meow.</p>

</main>

<div class="floor" aria-hidden="true">
  <svg class="hole" viewBox="0 0 58 50"><path d="M1 51V29C1 13.500 13.500 1 29 1s28 12.500 28 28v22Z"/></svg>
  <div class="track"><div class="run">
    <div class="mouse sprite"><div class="rows">
      <img src="assets/mouse-run.webp" width="1248" height="448" alt="">
    </div></div>
  </div></div>
</div>
</body>
</html>
